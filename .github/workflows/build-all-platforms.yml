name: Build Desktop Application Packages

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-packages:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macOS'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-24.04'
            os_name: 'Linux'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            os_name: 'Windows'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            squashfs-tools
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build frontend and Tauri application package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # PR builds only build; pushes to main and tags publish to the release
          tagName: ${{ github.event_name != 'pull_request' && 'v__VERSION__' || '' }}
          releaseName: 'OpenLight Studio v__VERSION__'
          releaseBody: 'See the release assets below for macOS (.dmg, .app), Windows (.msi, .exe), and Linux (.deb, .AppImage).'
          releaseDraft: false
          prerelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openlight-studio-${{ matrix.os_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  publish-checksums:
    name: Generate & Publish Release Checksums
    needs: build-packages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract release tag
        id: release_info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksums and update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_info.outputs.tag }}
        run: |
          mkdir -p release-files
          cd release-files

          echo "Downloading assets for release ${TAG_NAME}..."
          if ! gh release download "${TAG_NAME}" --dir . --clobber; then
            echo "Warning: Could not download release assets for ${TAG_NAME}."
            exit 0
          fi

          # Remove existing checksums file if present
          rm -f SHA256SUMS.txt checksums.txt

          ASSET_COUNT=$(ls -1 | wc -l | tr -d ' ')
          if [ "${ASSET_COUNT}" -eq 0 ]; then
            echo "No assets found in release ${TAG_NAME}."
            exit 0
          fi

          echo "Generating SHA256SUMS.txt for ${ASSET_COUNT} files..."
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          echo "Uploading SHA256SUMS.txt to GitHub release ${TAG_NAME}..."
          gh release upload "${TAG_NAME}" SHA256SUMS.txt --clobber

          EXISTING_BODY=$(gh release view "${TAG_NAME}" --json body -q .body 2>/dev/null || true)
          # Strip old checksum section if it exists
          CLEAN_BODY=$(echo "${EXISTING_BODY}" | awk '/### 🔐 SHA-256 Checksums/{exit} {print}')

          DEFAULT_BODY="See the release assets below for macOS (.dmg, .app), Windows (.msi, .exe), and Linux (.deb, .AppImage)."
          BASE_BODY="${CLEAN_BODY:-$DEFAULT_BODY}"

          printf "%s\n\n### 🔐 SHA-256 Checksums\n\n" "$BASE_BODY" > release-notes.md
          echo "| File | SHA-256 Checksum |" >> release-notes.md
          echo "| :--- | :--- |" >> release-notes.md
          while read -r hash file; do
            if [ -n "$file" ] && [ "$file" != "SHA256SUMS.txt" ]; then
              echo "| \`${file}\` | \`${hash}\` |" >> release-notes.md
            fi
          done < SHA256SUMS.txt
          echo "" >> release-notes.md
          echo "#### Verifying Checksums" >> release-notes.md
          echo "- **macOS / Linux**: \`shasum -a 256 <filename>\` or \`sha256sum -c SHA256SUMS.txt\`" >> release-notes.md
          echo "- **Windows (PowerShell)**: \`Get-FileHash <filename> -Algorithm SHA256\`" >> release-notes.md

          echo "Updating release description with checksums..."
          gh release edit "${TAG_NAME}" --notes-file release-notes.md
          echo "Done!"
